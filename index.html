<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ommy Crack — URL Fixer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e12;
      --surface: #1a1a24;
      --border: #2a2a3a;
      --accent: #7c6aef;
      --accent-hover: #6a56e0;
      --text: #e4e4ef;
      --text-dim: #8888a0;
      --success: #34d399;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 40px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 680px;
    }

    .version-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .version-btn {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .version-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .version-btn.active {
      border-color: var(--accent);
      background: rgba(124, 106, 239, 0.12);
      color: var(--accent);
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea::placeholder { color: var(--text-dim); opacity: 0.5; }

    .btn-fix {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-fix:hover { background: var(--accent-hover); }

    .output-section {
      margin-top: 28px;
      display: none;
    }

    .output-section.visible { display: block; }

    .output-box {
      position: relative;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      padding-right: 48px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      word-break: break-all;
      color: var(--success);
      min-height: 48px;
    }

    .btn-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-copy:hover { border-color: var(--accent); color: var(--accent); }

    .btn-copy svg { width: 16px; height: 16px; }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--success);
      color: #0e0e12;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .audio-preview {
      margin-top: 16px;
      display: none;
    }

    .audio-preview.visible { display: block; }

    .audio-preview audio {
      width: 100%;
      border-radius: 8px;
      outline: none;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <h1>Ommy Crack</h1>
  <p class="subtitle">Paste a tampered URL and get the clean version</p>

  <div class="card">
    <label>Select Version</label>
    <div class="version-toggle">
      <button class="version-btn active" data-version="storyblock" onclick="selectVersion('storyblock')">Storyblock</button>
      <button class="version-btn" data-version="abcaudio" onclick="selectVersion('abcaudio')">ABCAudio</button>
    </div>

    <label>Tampered URL</label>
    <textarea id="inputUrl" placeholder="Paste your tampered URL here..."></textarea>

    <button class="btn-fix" onclick="fixUrl()">Fix URL</button>

    <div class="output-section" id="outputSection">
      <div class="divider"></div>
      <label>Fixed URL</label>
      <div class="output-box">
        <span id="outputUrl"></span>
        <button class="btn-copy" onclick="copyUrl()" title="Copy to clipboard">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>

      <div class="audio-preview" id="audioPreview">
        <div class="divider"></div>
        <label>Preview</label>
        <audio id="audioPlayer" controls preload="none"></audio>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard</div>

  <script>
    let currentVersion = 'storyblock';

    function selectVersion(version) {
      currentVersion = version;
      document.querySelectorAll('.version-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.version === version);
      });
    }

    const fixers = {
      storyblock(raw) {
        // Storyblock tampered URLs have escaped forward slashes: \/ -> /
        return raw
          .replace(/\\\//g, '/')
          .replace(/\\&/g, '&')
          .replace(/\\=/g, '=')
          .trim();
      },
      abcaudio(raw) {
        // Placeholder — will be implemented later
        return raw.trim();
      }
    };

    function fixUrl() {
      const raw = document.getElementById('inputUrl').value;
      if (!raw.trim()) return;

      const fixed = fixers[currentVersion](raw);
      document.getElementById('outputUrl').textContent = fixed;
      document.getElementById('outputSection').classList.add('visible');

      const audioPreview = document.getElementById('audioPreview');
      const audioPlayer = document.getElementById('audioPlayer');

      if (/\.(mp3|wav|ogg|m4a|aac|flac)(\?|$)/i.test(fixed)) {
        audioPlayer.src = fixed;
        audioPreview.classList.add('visible');
      } else {
        audioPreview.classList.remove('visible');
        audioPlayer.src = '';
      }
    }

    function copyUrl() {
      const text = document.getElementById('outputUrl').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1500);
      });
    }

    // Auto-fix on paste
    document.getElementById('inputUrl').addEventListener('paste', () => {
      setTimeout(fixUrl, 50);
    });

    // Fix on Enter key
    document.getElementById('inputUrl').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        fixUrl();
      }
    });
  </script>
</body>
</html>
